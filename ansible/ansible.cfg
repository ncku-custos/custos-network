[defaults]
inventory = inventory.ini
roles_path = roles
# Executable password source: uses .vault-pass, minting it on first use — flagless
# runs work before AND after a vault exists (relative path is fine: this cfg is
# only discovered when running from ansible/).
vault_password_file = vault-pass.sh
host_key_checking = False
retry_files_enabled = False
nocows = True

[ssh_connection]
pipelining = True

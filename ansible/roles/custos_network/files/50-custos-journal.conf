# Installed by the custos_network role alongside the /var/log/journal bind
# mount (var-log-journal.mount): with the journal on eMMC, cap it so log
# growth can neither wear the flash nor fill the rootfs. A vendor cap in a
# lexically later file (e.g. size.conf) still wins — this is only the floor.
[Journal]
SystemMaxUse=50M

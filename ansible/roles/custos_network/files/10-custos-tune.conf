# Managed by Ansible (custos_network role) — do not edit.
#
# The AP carries this in custos-hostapd.service; the distro's wpa_supplicant@.service
# has no idea custos-wifi-tune exists. Without it, anything that starts the supplicant
# without also pulling the tune oneshot (a udev event that races the wlan0 -> wlx<mac>
# rename, a bare `systemctl start`) associates on an untuned radio: wrong reg domain,
# power-save still on. Observed after a USB rebind: supplicant active, tune inactive.
#
# Installed as a per-instance drop-in (wpa_supplicant@<flight-iface>.service.d/) so it
# touches only the flight radio — a mgmt-WiFi wpa_supplicant@<other-iface> on a
# NetworkManager-less box keeps the distro behaviour and never runs the tune script.
[Unit]
Wants=custos-wifi-tune@%i.service
After=custos-wifi-tune@%i.service

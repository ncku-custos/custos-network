---
- name: Validate role parameters
  ansible.builtin.assert:
    that:
      - custos_network_role in ['ap', 'sta']
      - custos_network_ip is defined
      # systemd escapes '-' as \x2d in device-unit names, and the distro
      # wpa_supplicant@.service unescapes %I ('-' → '/') — real NIC names
      # (wlan0, wlp0s20f3, wlx<mac>, usb0, enx<mac>) never contain one.
      - "'-' not in custos_network_flight_iface"
      # channel/freq must move together (5 GHz: freq = 5000 + 5*channel).
      - custos_network_freq | int == 5000 + 5 * (custos_network_channel | int)
      # Outside dev, refuse to ship the committed dev PSK — vault a real one (see README).
      - custos_network_env == 'dev' or custos_network_wifi_psk != 'custos-dev-changeme'
      # The NAT uplink must never be the flight radio itself.
      - not (custos_network_enable_nat | bool) or custos_network_uplink_iface != custos_network_flight_iface
    fail_msg: >-
      Set custos_network_role (ap|sta) in group_vars. custos_network_flight_iface must not
      contain '-'. custos_network_freq must equal 5000 + 5*custos_network_channel (see the
      channel table in defaults). With custos_network_env != 'dev', a vaulted vault_wifi_psk
      must replace the dev PSK. With NAT enabled, custos_network_uplink_iface must differ
      from custos_network_flight_iface.

# The role restarts the flight link — a control connection riding it is cut mid-run
# (this exact failure happened in the field). ansible_host is the only mgmt-path
# signal that survives become (sudo strips SSH_CONNECTION from the env), so a
# hostname that resolves to a flight IP slips through — see the README warning.
- name: Refuse to provision over the flight interface
  vars:
    custos_network_flight_fact: "{{ ansible_facts[custos_network_flight_iface] | default({}) }}"
    custos_network_flight_ips: >-
      {{ ([custos_network_flight_fact.ipv4 | default({})]
          + (custos_network_flight_fact.ipv4_secondaries | default([])))
         | map(attribute='address', default='') | select | list }}
  ansible.builtin.assert:
    that:
      - custos_network_flight_iface in ansible_facts.interfaces
      - custos_network_allow_flight_mgmt | bool
        or (ansible_host | default(''))
           not in custos_network_flight_ips + [custos_network_drone_ip, custos_network_ground_ip]
    fail_msg: >-
      Flight interface '{{ custos_network_flight_iface }}' must exist on the host
      (check `ip link` / custos_network_flight_iface), and ansible_host
      ({{ ansible_host | default('<inventory name>') }}) must not be one of its
      addresses ({{ custos_network_flight_ips | default([]) }}) or a flight-net IP —
      the role restarts that link and would cut this connection mid-run. Provision
      over a management path (see README "Provision"), or set
      custos_network_allow_flight_mgmt=true if you accept the drop.

- name: Install Wi-Fi link packages
  ansible.builtin.apt:
    name:
      - hostapd
      - wpasupplicant
      - iw
      - rfkill
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == 'Debian'   # S4 — offline/non-Debian boards must pre-stage these

# --- Hand the flight interface to networkd: stop NetworkManager and the plain
# wpa_supplicant from grabbing it. Only the flight NIC is unmanaged — uplink/mgmt
# NICs stay with whatever manages them today. ---
- name: Detect NetworkManager
  ansible.builtin.stat:
    path: /usr/bin/nmcli
  register: custos_network_nmcli

- name: Unmanage the flight interface in NetworkManager
  when: custos_network_nmcli.stat.exists   # S3 — only if NM is present
  block:
    - name: Ensure NetworkManager conf.d exists
      ansible.builtin.file:
        path: /etc/NetworkManager/conf.d
        state: directory
        mode: "0755"
    - name: Drop the unmanaged-devices file
      ansible.builtin.template:
        src: 99-custos-unmanaged.conf.j2
        dest: /etc/NetworkManager/conf.d/99-custos-unmanaged.conf
        mode: "0644"
      notify: Reload NetworkManager

# NM runs ALL its WiFi clients (uplink/hotspot included) through this one D-Bus
# unit — never stop it. The unmanaged-devices conf above is what keeps NM (and its
# supplicant) off the flight NIC. masked:false also repairs boxes damaged by the
# old unconditional mask, which cut a field laptop's uplink WiFi.
- name: Keep the shared wpa_supplicant available for NetworkManager
  ansible.builtin.systemd:
    name: wpa_supplicant.service
    masked: false
    state: started
  when: custos_network_nmcli.stat.exists

# No NM: nothing needs the shared unit; mask it so a vendor drop-in (-i <iface>)
# can't grab the flight NIC. If mgmt WiFi on such a box rides this unit, this
# cuts it — use wired mgmt or wpa_supplicant@<mgmt-iface> there (see README).
- name: Mask the non-instanced wpa_supplicant.service
  ansible.builtin.systemd:
    name: wpa_supplicant.service
    masked: true
    state: stopped
  when: not custos_network_nmcli.stat.exists

- name: Mask the packaged hostapd.service (AP only)
  ansible.builtin.systemd:
    name: hostapd.service
    masked: true
    state: stopped
  when: custos_network_role == 'ap'

# Release the flight interface from NetworkManager BEFORE networkd takes it
# (avoids a two-manager race).
- name: Apply NetworkManager + mask changes now
  ansible.builtin.meta: flush_handlers

- name: Enable and start systemd-networkd
  ansible.builtin.systemd:
    name: systemd-networkd.service
    enabled: true
    state: started

# --- Common artifacts: the power-save/regdomain oneshot ---
- name: Install the Wi-Fi tuning script
  ansible.builtin.copy:
    src: custos-wifi-tune
    dest: /usr/local/sbin/custos-wifi-tune
    mode: "0755"

- name: Install the Wi-Fi tuning oneshot unit
  ansible.builtin.copy:
    src: custos-wifi-tune@.service
    dest: /etc/systemd/system/custos-wifi-tune@.service
    mode: "0644"
  notify: Reload systemd daemon

# WantedBy=multi-user.target starts the flight units once, at boot. A USB flight
# radio that enumerates after systemd's 90s device-job timeout therefore never gets
# started at all — the units fail with result 'dependency' and nothing retries. This
# rule makes the device pull them in instead, on coldplug and on every re-enumeration.
- name: Install the flight-interface udev rule
  ansible.builtin.template:
    src: 99-custos-flight.rules.j2
    dest: /etc/udev/rules.d/99-custos-flight.rules
    mode: "0644"
  notify: Reload udev rules

# Single source of truth for the on-box scripts (custos-wifi-tune, health-check.sh).
# Must land before the tuning oneshot below, which reads it.
# Tagged nat: health-check.sh auto-detects NAT from CUSTOS_NAT, so a
# `--tags nat` run must refresh the facts file too.
- name: Write the on-box network facts file
  ansible.builtin.template:
    src: custos-network.env.j2
    dest: /etc/custos-network.env
    mode: "0644"
  notify: Re-run the Wi-Fi tuning oneshot
  tags: [nat]

# Set reg domain + power-save off BEFORE hostapd/wpa_supplicant come up, so the STA never
# tries to associate on ch149 with the wrong regdomain. Both daemons now pull this in via
# Wants= (the AP in its unit, the STA in its drop-in), but start it explicitly here so it
# is applied ahead of the restarts below.
- name: Start the Wi-Fi tuning oneshot
  ansible.builtin.systemd:
    name: "custos-wifi-tune@{{ custos_network_flight_iface }}.service"
    enabled: false          # udev starts it on device arrival — see below
    state: started
    daemon_reload: true

# --- Static IP via networkd ---
# Tagged nat: the template carries the drone's conditional Gateway=/DNS=, so a
# `--tags nat` run must deliver it too (assumes a previously fully-provisioned host).
- name: Configure the static IP on the flight interface
  ansible.builtin.template:
    src: flight.network.j2
    dest: /etc/systemd/network/10-custos-flight.network
    mode: "0644"
  notify: Reconfigure the flight interface
  tags: [nat]

# --- Role-specific config ---
- name: Configure hostapd (AP)
  when: custos_network_role == 'ap'
  block:
    - name: Template hostapd.conf
      ansible.builtin.template:
        src: hostapd.conf.j2
        dest: /etc/hostapd/hostapd.conf
        mode: "0600"          # holds the PSK — root-only
      diff: false             # never print the rendered PSK in --diff runs
      notify: Restart hostapd
    - name: Install the custos-hostapd unit
      ansible.builtin.template:
        src: custos-hostapd.service.j2
        dest: /etc/systemd/system/custos-hostapd.service
        mode: "0644"
      notify:
        - Reload systemd daemon
        - Restart hostapd

- name: Configure wpa_supplicant (STA)
  when: custos_network_role == 'sta'
  block:
    - name: Template wpa_supplicant.conf
      ansible.builtin.template:
        src: wpa_supplicant.conf.j2
        dest: "/etc/wpa_supplicant/wpa_supplicant-{{ custos_network_flight_iface }}.conf"
        mode: "0600"              # holds the PSK — root-only
      diff: false                 # never print the rendered PSK in --diff runs
      notify: Restart wpa_supplicant

    # Per-instance drop-in dir: scopes the Wants= below to the flight radio only.
    - name: Ensure the flight wpa_supplicant drop-in directory exists
      ansible.builtin.file:
        path: "/etc/systemd/system/wpa_supplicant@{{ custos_network_flight_iface }}.service.d"
        state: directory
        mode: "0755"

    # The AP gets tune-before-radio from custos-hostapd.service's own Wants=/After=.
    # Give the STA the same guarantee, so no start path can bring the supplicant up
    # on an untuned radio (wrong reg domain, power-save on).
    - name: Bind the flight wpa_supplicant to the Wi-Fi tuning oneshot
      ansible.builtin.copy:
        src: 10-custos-tune.conf
        dest: "/etc/systemd/system/wpa_supplicant@{{ custos_network_flight_iface }}.service.d/10-custos-tune.conf"
        mode: "0644"
      notify:
        - Reload systemd daemon
        - Restart wpa_supplicant

# Apply daemon-reload + the flight-interface reconfigure + service restarts before
# the enable checks.
- name: Apply config changes now
  ansible.builtin.meta: flush_handlers

# --- Ensure running (idempotent after the restarts above) ---
#
# enabled: false is deliberate, not an oversight. WantedBy=multi-user.target starts these
# once, at boot, and both hard-depend on sys-subsystem-net-devices-<iface>.device. A USB
# flight radio that has not enumerated within DefaultDeviceTimeoutSec (90s) therefore
# (a) stalls the boot for 90s waiting on a device unit nobody can satisfy — measured on
# ground-01: network.target @1min 30s — and then (b) fails both units with result
# 'dependency', with nothing to retry when the adapter finally shows up.
#
# 99-custos-flight.rules makes the device pull them in instead. udev replays the event at
# coldplug for a radio already present at boot, and fires again on hotplug and on USB
# re-enumeration, so one mechanism covers every arrival path. state: started keeps this
# run converging; the boot path is udev's.
- name: Start hostapd (AP)
  ansible.builtin.systemd:
    name: custos-hostapd.service
    enabled: false
    state: started
  when: custos_network_role == 'ap'

- name: Start wpa_supplicant (STA)
  ansible.builtin.systemd:
    name: "wpa_supplicant@{{ custos_network_flight_iface }}.service"
    enabled: false
    state: started
  when: custos_network_role == 'sta'

# --- Optional ground→internet NAT uplink (off by default; the bare link is unchanged) ---
# import_tasks (static) so the tag and condition propagate to every imported task.
- name: Ground NAT uplink (custos_network_enable_nat)
  ansible.builtin.import_tasks: nat.yml
  when: custos_network_enable_nat | bool
  tags: [nat]

---
# Handler order matters: the daemon reload must precede the service restarts so systemd knows
# the freshly-installed unit files.

- name: Reload NetworkManager
  ansible.builtin.systemd:
    name: NetworkManager.service
    state: reloaded

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

# Oneshot + RemainAfterExit: restarting re-executes the script, so a country or
# interface change in /etc/custos-network.env actually reapplies the reg domain.
- name: Re-run the Wi-Fi tuning oneshot
  ansible.builtin.systemd:
    name: "custos-wifi-tune@{{ custos_network_flight_iface }}.service"
    state: restarted

# Apply the new .network to the flight interface ONLY — never `systemctl restart
# systemd-networkd`, which re-applies every interface and can drop the control
# node's SSH on the mgmt NIC (S1).
- name: Reconfigure the flight interface
  ansible.builtin.command:
    cmd: "{{ item }}"
  loop:
    - networkctl reload
    - "networkctl reconfigure {{ custos_network_flight_iface }}"
  changed_when: false

- name: Restart hostapd
  ansible.builtin.systemd:
    name: custos-hostapd.service
    state: restarted

- name: Restart wpa_supplicant
  ansible.builtin.systemd:
    name: "wpa_supplicant@{{ custos_network_flight_iface }}.service"
    state: restarted

# Scoped to our file — `sysctl --system` would re-apply every file on the box.
- name: Apply custos sysctl
  ansible.builtin.command:
    cmd: sysctl -p /etc/sysctl.d/90-custos-nat.conf
  changed_when: false

# `nft -f` is one atomic transaction — no delete/reload window, unlike restarting the unit.
- name: Reload custos NAT rules
  ansible.builtin.command:
    cmd: nft -f /etc/custos-nat.nft
  changed_when: false

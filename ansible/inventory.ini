# Provision over a MANAGEMENT path, NOT the flight wlan0 (see README "Ansible").
# ansible_host MUST be a reachable management IP — never 192.168.4.1 / 192.168.4.2,
# because the role restarts wlan0 and would cut a connection riding it.
#   - ground: reachable over its eth0/cellular uplink
#   - drone:  reachable over a wired bench Ethernet / USB-NIC during provisioning
#
# Real values go in git-ignored host_vars/<host>.yml overlays (they outrank the
# placeholders below) — copy host_vars/*.yml.example, strip the suffix, fill in.

[drone]
drone-01 ansible_host=CHANGEME-drone-mgmt-ip

[ground]
ground-01 ansible_host=CHANGEME-ground-mgmt-ip

[custos:children]
drone
ground

[custos:vars]
ansible_user=CHANGEME
